<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多平台商品数据汇总</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #edf2ff 0%, #f5f7ff 50%, #f0f4ff 100%); color: #37474f; overflow: hidden; height: 100vh; }

  .app { display: flex; flex-direction: column; height: 100vh; padding-bottom: env(safe-area-inset-bottom, 0px); }

  .header { background: #fff; color: #1a1a2e; padding-top: env(safe-area-inset-top, 0px); flex-shrink: 0; border-bottom: 1px solid #e8eaf6; box-shadow: 0 1px 4px rgba(92,107,192,.06); }
  .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; }
  .header h1 { font-size: 17px; font-weight: 700; background: linear-gradient(135deg,#5c6bc0,#3949ab); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .update-time { font-size: 10px; color: #999; }
  .logout-btn { padding: 3px 10px; background: transparent; color: #5c6bc0; border: 1px solid #c5cae9; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all .2s; }
  .logout-btn:active { background: #eef0ff; }

  .top-bar { background: #fff; padding: 8px 14px; border-bottom: 1px solid #e8eaf6; flex-shrink: 0; }
  .top-bar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .total-badge { font-size: 12px; color: #666; white-space: nowrap; flex-shrink: 0; }
  .total-badge strong { color: #5c6bc0; font-size: 15px; }
  .top-actions { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; }
  .search-input { padding: 7px 12px; border: 1px solid #c5cae9; border-radius: 20px; font-size: 13px; background: #f8f9ff; outline: none; width: 180px; transition: all .2s; color: #37474f; }
  .search-input::placeholder { color: #aaa; }
  .search-input:focus { border-color: #5c6bc0; background: #fff; width: 240px; box-shadow: 0 0 0 2px rgba(92,107,192,.1); }
  .icon-btn { width: 32px; height: 32px; border: 1px solid #c5cae9; border-radius: 50%; background: #f8f9ff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #5c6bc0; transition: all .15s; flex-shrink: 0; }
  .icon-btn:active { background: #eef0ff; transform: scale(.92); }
  .filter-select { padding: 6px 10px; border: 1px solid #c5cae9; border-radius: 16px; font-size: 12px; background: #f8f9ff; color: #37474f; outline: none; cursor: pointer; flex-shrink: 0; max-width: 120px; appearance: auto; }
  .filter-select:focus { border-color: #5c6bc0; box-shadow: 0 0 0 2px rgba(92,107,192,.1); }
  .filter-select option { background: #fff; color: #37474f; }
  .filter-select.active { background: #eef0ff; border-color: #5c6bc0; color: #5c6bc0; font-weight: 600; }
  .top-links { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .order-btn { display: inline-flex; align-items: center; padding: 3px 10px; color: #fff; border-radius: 14px; font-size: 10px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: opacity .2s; }
  .order-btn:active { opacity: .7; }
  .order-btn.s1 { background: #5c6bc0; }
  .order-btn.s2 { background: #26a69a; }
  .order-btn.s3 { background: #ef5350; }
  .order-btn.s4 { background: #ff8f00; }

  .cat-bar { display: flex; gap: 0; background: #fff; padding: 6px 14px; border-bottom: 1px solid #e8eaf6; flex-shrink: 0; }
  .cat-btn { padding: 4px 16px; border: none; background: transparent; font-size: 13px; color: #999; cursor: pointer; transition: all .15s; border-radius: 14px; font-weight: 500; }
  .cat-btn.active { background: #eef0ff; color: #5c6bc0; font-weight: 600; }
  .cat-btn:active { background: #e3e5ff; }

  .table-wrap { flex: 1; overflow: hidden; background: rgba(255,255,255,.75); backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2); }
  .table-inner { height: 100%; overflow-y: auto; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: linear-gradient(135deg,#5c6bc0,#3949ab); text-align: center; padding: 9px 6px; font-weight: 600; color: #fff; border-bottom: none; white-space: nowrap; position: sticky; top: 0; z-index: 2; font-size: 11px; letter-spacing: .5px; }
  td { padding: 7px 6px; border-bottom: 1px solid #e8eaf6; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; background: #fff; color: #37474f; }
  tr:nth-child(even) td { background: #fafaff; }
  tr:hover td { background: #eef0ff; }
  tr:active td { background: #e3e5ff; }
  tr.selected td { background: #e8eaff; box-shadow: inset 3px 0 0 #5c6bc0; }
  /* 隐藏标签列，搜索仍支持标签匹配 */
  th:nth-child(7), td:nth-child(7) { display: none; }

  .source-tag { display: inline-block; font-size: 9px; padding: 2px 8px; border-radius: 10px; color: #fff; font-weight: 600; }
  .source-tag.s1 { background: #5c6bc0; }
  .source-tag.s2 { background: #26a69a; }
  .source-tag.s3 { background: #ef5350; }
  .source-tag.s4 { background: #ff8f00; }
  .tag { display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 3px; margin: 1px 2px; background: #e3f2fd; color: #0d47a1; white-space: nowrap; }
  .tag.green { background: #e8f5e9; color: #1b5e20; }
  .tag.red { background: #ffebee; color: #b71c1c; }
  .tag.purple { background: #f3e5f5; color: #4a148c; }
  .tag.orange { background: #fff3e0; color: #bf360c; }
  .tag.teal { background: #e0f2f1; color: #004d40; }
  .commission { color: #1b5e20; font-weight: 700; background: rgba(232,245,233,.5); padding: 1px 6px; border-radius: 4px; display: inline-block; }
  .price { color: #bf360c; font-weight: 700; background: rgba(255,243,224,.5); padding: 1px 6px; border-radius: 4px; display: inline-block; }
  .no-result { text-align: center; padding: 60px 20px; color: #555; font-size: 14px; }

  /* ===== 图文卡片模式 ===== */
  .card-wrap { display: none; padding: 10px; gap: 10px; flex-direction: column; }
  body.card-mode .table-wrap table { display: none; }
  body.card-mode .card-wrap { display: flex; }
  .card-item { background: #fff; border-radius: 12px; padding: 14px; border: 1px solid #e8eaf6; box-shadow: 0 1px 4px rgba(92,107,192,.06); transition: all .15s; }
  .card-item:active { transform: scale(.98); background: #fafbff; }
  .card-name { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-bottom: 10px; display: block; text-decoration: none; line-height: 1.4; }
  .card-name:active { opacity: .7; }
  .card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .card-operator { font-size: 10px; color: #666; background: rgba(240,242,255,.6); padding: 2px 8px; border-radius: 8px; display: inline-block; }
  .card-tag { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 4px; background: #e3f2fd; color: #0d47a1; }
  .card-tag.green { background: #e8f5e9; color: #1b5e20; }
  .card-tag.red { background: #ffebee; color: #b71c1c; }
  .card-tag.purple { background: #f3e5f5; color: #4a148c; }
  .card-tag.orange { background: #fff3e0; color: #bf360c; }
  .card-tag.teal { background: #e0f2f1; color: #004d40; }
  .card-meta { font-size: 10px; color: #999; margin-bottom: 10px; }
  .card-actions { display: flex; gap: 8px; align-items: center; padding-top: 10px; border-top: 1px solid rgba(200,200,220,.25); }
  .card-action-link { display: inline-flex; align-items: center; padding: 6px 14px; background: linear-gradient(135deg,#5c6bc0,#3949ab); color: #fff; border-radius: 16px; font-size: 12px; font-weight: 500; text-decoration: none; transition: all .15s; }
  .card-action-link:active { opacity: .8; transform: scale(.96); }

  .bottom-bar { display: flex; background: rgba(255,255,255,.75); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); border-top: 1px solid #e8eaf6; padding-bottom: env(safe-area-inset-bottom, 0px); flex-shrink: 0; }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 2px 6px; border: none; background: transparent; color: #999; font-size: 10px; cursor: pointer; transition: all .15s; position: relative; }
  .tab-btn:active { background: #eef0ff; }
  .tab-btn.active { color: #5c6bc0; font-weight: 600; }
  .tab-btn.active::after { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 20px; height: 2px; background: #5c6bc0; border-radius: 0 0 2px 2px; }
  .tab-btn .tab-icon { font-size: 18px; line-height: 1; margin-bottom: 1px; }
  .tab-btn .tab-label { font-size: 10px; }

  .login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .login-box { background: #fff; padding: 36px 28px; border-radius: 20px; box-shadow: 0 8px 40px rgba(92,107,192,.15); text-align: center; width: 320px; max-width: 88%; }
  .login-box h2 { margin-bottom: 4px; font-size: 18px; color:#1a1a2e; }
  .login-box p { color: #666; font-size: 13px; margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 12px 14px; border: 1px solid #c5cae9; border-radius: 12px; font-size: 15px; outline: none; margin-bottom: 12px; background: #f8f9ff; box-sizing:border-box; }
  .login-box input:focus { border-color: #5c6bc0; box-shadow: 0 0 0 2px rgba(92,107,192,.1); }
  .login-box .login-btn { width: 100%; padding: 12px; background: linear-gradient(135deg,#5c6bc0,#3949ab); color: #fff; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; font-weight: 600; transition: all .15s; }
  .login-box .login-btn:active { opacity: .85; }
  .login-box .login-err { color: #ef5350; font-size: 12px; margin-top: 10px; display: none; }

  .qr-modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 99999; cursor: pointer; }
  .qr-modal img { max-width: 80vw; max-height: 80vh; border-radius: 12px; }

  .import-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 9998; display: none; }
  .import-overlay.show { display: block; }
  .import-dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #fff; border-radius: 20px; z-index: 9999; padding: 20px 24px; width: 560px; max-width: 92%; max-height: 85vh; display: none; flex-direction: column; box-shadow: 0 8px 40px rgba(92,107,192,.15); }
  .import-dialog.show { display: flex; }
  .import-dialog h3 { font-size: 15px; margin-bottom: 12px; color: #1a1a2e; }
  .import-dialog select, .import-dialog textarea { width: 100%; margin-bottom: 10px; border: 1px solid #c5cae9; border-radius: 10px; font-size: 13px; outline: none; font-family: inherit; background: #f8f9ff; }
  .import-dialog select { padding: 10px 12px; }
  .import-dialog textarea { padding: 10px; resize: vertical; min-height: 200px; line-height: 1.5; tab-size: 2; }
  .import-dialog textarea:focus, .import-dialog select:focus { border-color: #5c6bc0; box-shadow: 0 0 0 2px rgba(92,107,192,.1); }
  .import-dialog .import-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .import-dialog .import-actions button { padding: 9px 20px; border: none; border-radius: 12px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .import-dialog .import-actions .btn-primary { background: linear-gradient(135deg,#5c6bc0,#3949ab); color: #fff; }
  .import-dialog .import-actions .btn-primary:active { opacity: .85; }
  .import-dialog .import-actions .btn-cancel { background: #f5f5f5; color: #555; }
  .import-dialog .import-actions .btn-cancel:active { background: #eee; }
  .import-dialog .import-status { font-size: 12px; color: #666; margin-bottom: 10px; }

  .back-to-top { display: none; position: fixed; right: 16px; bottom: 80px; width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #5c6bc0; border: 1px solid #c5cae9; font-size: 18px; cursor: pointer; box-shadow: 0 2px 8px rgba(92,107,192,.12); align-items: center; justify-content: center; z-index: 100; transition: all .2s; }
  .back-to-top:active { transform: scale(.9); background: #f0f2ff; }

  body.share-mode .header { display: none !important; }
  body.share-mode .logout-btn { display: none !important; }
  body.share-mode .login-hide, body.share-mode .order-btn { display: none !important; }
  body.share-mode .login-btn-floating { display: none !important; }
  body:not(.admin-mode) .header { display: none !important; }
  body:not(.admin-mode) .login-hide { display: none !important; }
  body:not(.admin-mode) .order-btn { display: none !important; }
  body:not(.admin-mode) .logout-btn { display: none !important; }

  .login-btn-floating { display: flex; position: fixed; left: 12px; bottom: 56px; width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #5c6bc0; border: 1px solid #c5cae9; font-size: 16px; cursor: pointer; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(92,107,192,.1); z-index: 100; transition: all .2s; }
  .login-btn-floating:active { transform: scale(.9); background: #f0f2ff; }
  body.admin-mode .login-btn-floating { display: none; }

  /* 微信环境拦截 */
  body.wechat-block { overflow: hidden !important; }
  body.wechat-block .wechat-overlay { display: flex !important; }
  body.wechat-block #app { display: none !important; }
  body.wechat-block .header { display: none !important; }
  body.wechat-block .login-btn-floating { display: none !important; }
  body.wechat-block .login-overlay { display: none !important; }
  .wechat-overlay { display: none; position: fixed; inset: 0; background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); z-index: 99999; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 40px 24px; }
  .wechat-overlay .wx-icon { font-size: 64px; margin-bottom: 20px; opacity: .6; }
  .wechat-overlay h2 { color: #fff; font-size: 20px; font-weight: 600; margin-bottom: 10px; }
  .wechat-overlay p { color: rgba(255,255,255,.6); font-size: 14px; margin-bottom: 28px; line-height: 1.6; max-width: 300px; }
  .wechat-overlay .wx-btn { display: inline-flex; align-items: center; gap: 6px; padding: 12px 32px; border: none; border-radius: 24px; background: rgba(255,255,255,.15); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all .2s; border: 1px solid rgba(255,255,255,.1); }
  .wechat-overlay .wx-btn:active { background: rgba(255,255,255,.25); transform: scale(.95); }
  .wechat-overlay .wx-tip { color: rgba(255,255,255,.35); font-size: 11px; margin-top: 20px; }

  .login-overlay { display: none; }
  .login-overlay.show { display: flex; }
  .login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9999; align-items: center; justify-content: center; }
  .login-box { background: #fff; padding: 36px 28px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.15); text-align: center; width: 320px; max-width: 88%; }
  .login-box h2 { margin-bottom: 4px; font-size: 18px; }
  .login-box p { color: #888; font-size: 13px; margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; margin-bottom: 12px; box-sizing:border-box; }
  .login-box input:focus { border-color: #5c6bc0; }
  .login-box .login-btn { width: 100%; padding: 12px; background: rgba(92,107,192,.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #fff; border: 1px solid rgba(255,255,255,.15); border-radius: 12px; font-size: 15px; cursor: pointer; font-weight: 600; transition: all .15s; }
  .login-box .login-btn:active { background: #5c6bc0; }
  .login-box .login-err { color: #ef5350; font-size: 12px; margin-top: 10px; display: none; }

  @media (max-width: 1024px) {
    th { padding: 6px 3px; }
    td { padding: 5px 3px; font-size: 11px; }
    /* 平板：隐藏创建时间和备注 */
    th:nth-child(9), td:nth-child(9) { display: none; }
    th:nth-child(10), td:nth-child(10) { display: none; }
  }
  @media (max-width: 768px) {
    .header-inner { padding: 6px 10px; }
    .header h1 { font-size: 14px; }
    .top-bar { padding: 4px 8px; }
    .top-bar-row { gap: 4px; }
    .total-badge { font-size: 10px; }
    .search-input { width: 100px; font-size: 11px; padding: 5px 8px; }
    .search-input:focus { width: 130px; }
    .filter-select { font-size: 10px; padding: 4px 6px; max-width: 90px; }
    .top-links { gap: 2px; margin-top: 4px; }
    .cat-bar { padding: 4px 8px; }
    .cat-btn { font-size: 12px; padding: 3px 12px; }

    table { table-layout: fixed; }
    th, td {
      padding: 5px 2px; font-size: 10px; line-height: 1.4;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; word-break: keep-all;
    }
    th { padding: 6px 2px; font-size: 10px; letter-spacing: .2px; }
    /* 非管理员/分享模式：6列 */
    th:nth-child(1), td:nth-child(1) { width: 11%; }  /* 来源 */
    th:nth-child(2), td:nth-child(2) { width: 24%; }  /* 商品名称 */
    th:nth-child(3), td:nth-child(3) { width: 8%; }   /* 运营商 */
    th:nth-child(4), td:nth-child(4) { width: 8%; }  /* 佣金 */
    th:nth-child(5), td:nth-child(5) { width: 8%; }  /* 价格 */
    th:nth-child(6), td:nth-child(6) { width: 8%; }   /* 结算方式 */
    th:nth-child(8), td:nth-child(8) { width: 8%; }  /* 年龄要求 */
    th:nth-child(11), td:nth-child(11) { width: 17%; }  /* 领取链接 */
    th:nth-child(12), td:nth-child(12) { width: 8%; }  /* 扫码领取 */
  }
  @media (max-width: 480px) {
    .header h1 { font-size: 12px; }
    .search-input { width: 80px; font-size: 10px; padding: 4px 6px; }
    .search-input:focus { width: 110px; }
    .filter-select { font-size: 9px; max-width: 75px; }
    .icon-btn { width: 28px; height: 28px; font-size: 14px; }
    .cat-bar { gap: 2px; }
    .cat-btn { font-size: 11px; padding: 2px 10px; }

    th, td { font-size: 9px; padding: 4px 1px; line-height: 1.3; }
    th { font-size: 9px; padding: 5px 1px; }
    /* 极小屏：缩短领取链接列 */
    th:nth-child(11), td:nth-child(11) { width: 16%; }
  }
</style>
</head>
<body>
<script>if(/MicroMessenger/i.test(navigator.userAgent)){document.body.className='wechat-block'}</script>

<div class="wechat-overlay">
  <div class="wx-icon">🔒</div>
  <h2>请在浏览器中打开</h2>
  <p>当前页面暂不支持微信内置浏览器访问<br>请点击右上角「···」选择「在浏览器中打开」</p>
  <a class="wx-btn" href="javascript:void(0)" onclick="copyUrl()">📋 复制链接</a>
  <div class="wx-tip">复制链接后粘贴到 Safari / Chrome 等浏览器打开</div>
</div>
<script>function copyUrl(){try{navigator.clipboard.writeText(location.href).then(function(){document.querySelector('.wx-btn').textContent='✅ 已复制'})}catch(e){prompt('复制链接:',location.href)}}</script>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>管理登录</h2>
    <p>输入管理员密码查看完整信息</p>
    <input type="password" id="adminPwd" placeholder="管理员密码">
    <button class="login-btn" id="loginBtn">登录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<button class="login-btn-floating" id="loginBtnFloat" onclick="showLoginModal()" title="管理员登录">🔐</button>

<div class="header">
  <div class="header-inner">
    <h1>多平台商品数据汇总</h1>
    <div class="header-right">
      <span class="update-time" id="updateTime"></span>
      <button class="logout-btn" id="logoutBtn" onclick="doLogout()" style="display:none">退出</button>
    </div>
  </div>
</div>

<div class="app" id="app">

  <div class="top-bar">
    <div class="top-bar-row">
      <span class="total-badge">总计 <strong id="totalCount">-</strong> 条</span>
      <div class="top-actions">
        <input class="search-input" id="searchInput" placeholder="搜索商品..." oninput="filterTable()">
        <button class="icon-btn login-hide" onclick="regenerateQR()" title="重新生成二维码" style="font-size:12px;width:auto;padding:0 10px;border-radius:16px;background:#5c6bc0;color:#fff">QR</button>

function getFilteredAndSortedItems() {

    if (currentOperator !== 'all') {

      if (op !== currentOperator) return false;

    if (currentCat === 'sim' && (isBroadband(item) || isMobileWifi(item))) return false;
    if (currentCat === 'broadband' && (!isBroadband(item) || isMobileWifi(item))) return false;
    if (currentCat === 'mobilewifi' && !isMobileWifi(item)) return false;
    if (keyword) {
      const nameMatch = item.name.toLowerCase().includes(keyword);
      const tagsMatch = (item.tags || []).some(function(t) { return t.toLowerCase().includes(keyword); });
      if (!nameMatch && !tagsMatch) return false;

    return true;

  filtered.sort(function(a, b) {

}

// ===== 登录（密码验证，hash 从 Supabase 读取） =====
async function hashPassword(pwd) {
  const encoder = new TextEncoder();
  const data = encoder.encode(pwd);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ===== 一键重新生成 QR 码并写入数据库 =====
async function regenerateQR() {
  if (!confirm('确定重新生成所有商品的二维码并更新到数据库？')) return;
  const btn = document.querySelector('[onclick="regenerateQR()"]');
  const orig = btn.textContent;
  btn.textContent = '...';
  btn.disabled = true;

  const pending = allItems.filter(it => !it.qrCode);
  if (pending.length === 0) {
    alert('所有商品已有二维码，无需重新生成');
    btn.textContent = orig;
    btn.disabled = false;
    return;
  }

  let success = 0, fail = 0;
  for (let i = 0; i < pending.length; i++) {
    const it = pending[i];
    const url = it.claimLink || it.detailUrl || it.shareLink || '';
    try {
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      const dataUrl = qr.createDataURL(4, 4);
      const { error } = await supaClient
        .from('products')
        .update({ claim_link: url, qr_code: dataUrl })
        .eq('id', it.id);
      if (error) throw error;
      it.qrCode = dataUrl;
      it.claimLink = url;
      success++;
    } catch (e) {
      console.error('QR 生成失败 id=' + it.id, e);
      fail++;
    }
    btn.textContent = success + '/' + pending.length;
  }

  renderItems();
  btn.textContent = '✅';
  btn.disabled = false;
  setTimeout(() => { btn.textContent = orig; }, 2000);
  alert('完成！成功更新 ' + success + ' 条，失败 ' + fail + ' 条');
}

        settle_mode: it.settleMode === 1 ? '一次性' : '次月返',
        created_at: it.createdAt || '',
        tags: (it.tagsSelect || []).map(function(t) { return (t && t.label) || ''; }).filter(Boolean),
        age: (function() { var a = ((it.limitRule || {}).age || []); return a.length ? a.join('~') : '-'; })(),
        share_link: '', remark: '',
      };
    });
  },
  '号易': function(raw) {
    var rows = (raw && raw.rows) || raw || [];
    if (!Array.isArray(rows)) return [];
    return rows.filter(function(it) { return it && typeof it === 'object'; }).map(function(it) {
      return {
        source: '号易', source_url: 'et.haomifi.com', source_login_url: 'https://et.haomifi.com/admin/',
        product_id: String(it.id || ''),
        name: String(it.goods_name || ''),
        detail_url: 'https://my.86hk.vip/#/pages/goods/details?goods_id=' + (it.id || '') + '&share_id=' + (it.agent_id || ''),
        operator: '',
        commission: '¥' + (it.agent_brokerage || 0),
        price: '-',
        settle_mode: it.settlement_method === 2 ? '次月返' : '一次性',
        created_at: it.create_time || '',
        tags: (it.point_msg || []).slice(),
        age: '-',
        share_link: it.out_url || '',
        remark: String(it.point || ''),
      };
    });
  },
  '172号卡': function(raw) {
    var data = (raw && raw.data) || raw || [];
    if (!Array.isArray(data)) return [];
    var smap = {1:'月返', 2:'次月返', 3:'一次性', 4:'年返', 5:'季度返', 6:'半年返', 7:'一次性买断'};
    return data.filter(function(it) { return it && typeof it === 'object'; }).map(function(it) {
      var t = [(it.areaRead || '')];
      if (it.disableArea) t.push('禁发' + it.disableArea);
      t = t.filter(Boolean);
      var age1 = it.age1 || '', age2 = it.age2 || '';
      return {
        source: '172号卡', source_url: 'haokaapi.lot-ml.com', source_login_url: 'https://haoka.lot-ml.com/',
        product_id: String(it.productID || ''),
        name: String(it.productName || ''),
        detail_url: 'https://sztc.rimian666.cn/h5orderEn/index?pudID=' + (it.sn || '') + '&userid=' + (it.userSn || ''),
        operator: it.operator || '',
        commission: it.sPriceRead || '-',
        price: it.price ? '¥' + it.price : '-',
        settle_mode: smap[it.backMoneyType] || String(it.backMoneyType || '-'),
        created_at: it.createTime || '',
        tags: t,
        age: (age1 || age2) ? age1 + '~' + age2 + '岁' : '-',
        share_link: '', remark: it.remark || '',
      };
    });
  },
  '政企校园卡': function(raw) {
    var data = (raw && raw.data) || raw || [];
    if (!Array.isArray(data)) return [];
    return data.filter(function(it) { return it && typeof it === 'object'; }).map(function(it) {
      return {
        source: '政企校园卡', source_url: 'unionesim.com', source_login_url: 'https://unionesim.com/',
        product_id: String(it.id || ''),
        name: String(it.name || ''),
        detail_url: it.public_product_url || 'https://unionesim.com/',
        operator: it.yys || '',
        commission: it.commission_display || ('¥' + (it.actual_commission || 0)),
        price: it.yuezu_format || '-',
        settle_mode: it.js_type_text || '-',
        created_at: it.create_time || '',
        tags: (String(it.tags || '').split(',')).filter(Boolean),
        age: it.age || '-',
        share_link: it.public_product_url || '',
        remark: it.mark || '',
      };
    });
  },
};

function showImportDialog() {
  document.getElementById('importOverlay').classList.add('show');
  document.getElementById('importDialog').classList.add('show');
  document.getElementById('importData').value = '';
  document.getElementById('importStatus').textContent = '';
}
function hideImportDialog() {
  document.getElementById('importOverlay').classList.remove('show');
  document.getElementById('importDialog').classList.remove('show');
}

async function doImport() {
  var source = document.getElementById('importSource').value;
  var rawText = document.getElementById('importData').value.trim();
  if (!rawText) { alert('请先粘贴 JSON 数据'); return; }

  var statusEl = document.getElementById('importStatus');
  var btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.textContent = '解析中...';

  var raw;
  try { raw = JSON.parse(rawText); } catch (e) {
    statusEl.textContent = '❌ JSON 格式错误：' + e.message;
    btn.disabled = false; btn.textContent = '解析并导入';
    return;
  }

  var parser = PARSERS[source];
  if (!parser) { alert('未知来源'); btn.disabled = false; btn.textContent = '解析并导入'; return; }

  var items = parser(raw);
  if (!items.length) { statusEl.textContent = '⚠️ 未解析出任何商品数据'; btn.disabled = false; btn.textContent = '解析并导入'; return; }

  // 生成 QR 码
  statusEl.textContent = '✅ 解析出 ' + items.length + ' 条，正在生成 QR 码...';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var url = it.detail_url || it.share_link || '';
    it.claim_link = url;
    if (url) {
      try {
        var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
        it.qr_code = qr.createDataURL(4, 4);
      } catch (e) { it.qr_code = ''; }
    } else { it.qr_code = ''; }
  }

  // 写入数据库（旧数据置为失效，再插入新数据）
  statusEl.textContent = '⏳ 正在写入数据库（已生成 ' + items.length + ' 个 QR 码）...';
  btn.textContent = '写入中...';

  try {
    // 将该渠道旧数据置为失效
    var { error: updErr } = await supaClient
      .from('products')
      .update({ active: false })
      .eq('source', source)
      .or('active.is.null,active.eq.true');
    if (updErr) throw new Error('置旧数据为失效失败: ' + updErr.message);

    // 新数据标记 active=true
    for (var k = 0; k < items.length; k++) items[k].active = true;

    // 批量插入
    var batchSize = 500;
    var inserted = 0;
    for (var j = 0; j < items.length; j += batchSize) {
      var batch = items.slice(j, j + batchSize);
      var { error: insErr } = await supaClient
        .from('products')
        .insert(batch);
      if (insErr) throw new Error('插入数据失败: ' + insErr.message);
      inserted += batch.length;
      statusEl.textContent = '⏳ 已写入 ' + inserted + '/' + items.length + ' 条...';
    }

    statusEl.textContent = '✅ 导入完成！共 ' + inserted + ' 条商品数据';
    btn.textContent = '✅ 完成';
    setTimeout(function() { btn.textContent = '解析并导入'; btn.disabled = false; }, 2000);

    // 刷新页面数据
    await loadData();
  } catch (e) {
    statusEl.textContent = '❌ ' + e.message;
    btn.disabled = false;
    btn.textContent = '解析并导入';
  }
}

// ===== 初始化 =====
// 登录按钮事件绑定（避免 onclick 全局函数依赖）
document.getElementById('loginBtn').addEventListener('click', doAdminLogin);
document.getElementById('adminPwd').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doAdminLogin();
});

// 行点击高亮（非 PC 端点击选中行，便于识别定位）
document.getElementById('tableBody').addEventListener('click', function(e) {
  var tr = e.target.closest('tr');
  if (!tr || !tr.parentNode) return;
  this.querySelectorAll('tr.selected').forEach(function(r) { r.classList.remove('selected'); });
  tr.classList.add('selected');
});

document.querySelector('.table-inner').addEventListener('scroll', function() {
  var btn = document.getElementById('backToTop');
  if (btn) btn.style.display = this.scrollTop > 300 ? 'flex' : 'none';
});

var isShare = location.search.includes('share');
if (isShare) {
  document.body.classList.add('share-mode');
} else if (localStorage.getItem('admin_logged_in')) {
  document.getElementById('logoutBtn').style.display = '';
  document.body.classList.add('admin-mode');
}
// 预加载管理员配置（非强制，后续登录时若未加载会自动加载）
fetchAdminConfig();

loadData();
setOrderUrls();
</script>
