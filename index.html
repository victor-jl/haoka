<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多平台商品数据汇总</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fa; color: #2c3e50; overflow: hidden; height: 100vh; }

  .app { display: flex; flex-direction: column; height: 100vh; padding-bottom: env(safe-area-inset-bottom, 0px); }

  .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding-top: env(safe-area-inset-top, 0px); flex-shrink: 0; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .update-time { font-size: 10px; color: rgba(255,255,255,.65); }
  .logout-btn { padding: 3px 10px; background: transparent; color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.4); border-radius: 6px; font-size: 11px; cursor: pointer; transition: all .2s; }
  .logout-btn:active { background: rgba(255,255,255,.15); }

  .top-bar { background: #fff; padding: 8px 14px; border-bottom: 1px solid #eee; flex-shrink: 0; }
  .top-bar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .total-badge { font-size: 12px; color: #666; white-space: nowrap; flex-shrink: 0; }
  .total-badge strong { color: #5c6bc0; font-size: 15px; }
  .top-actions { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; }
  .search-input { padding: 7px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; background: #f5f6fa; outline: none; width: 180px; transition: all .2s; }
  .search-input:focus { border-color: #5c6bc0; background: #fff; width: 240px; }
  .search-input::placeholder { color: #bbb; }
  .icon-btn { width: 32px; height: 32px; border: none; border-radius: 50%; background: #f0f0f5; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; transition: all .15s; flex-shrink: 0; }
  .icon-btn:active { background: #ddd; transform: scale(.92); }
  .top-links { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .order-btn { display: inline-flex; align-items: center; padding: 3px 10px; color: #fff; border-radius: 14px; font-size: 10px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: opacity .2s; }
  .order-btn:active { opacity: .7; }
  .order-btn.s1 { background: #5c6bc0; }
  .order-btn.s2 { background: #26a69a; }
  .order-btn.s3 { background: #ef5350; }
  .order-btn.s4 { background: #ff8f00; }

  .table-wrap { flex: 1; overflow: hidden; background: #fff; }
  .table-inner { height: 100%; overflow-y: auto; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #f5f7ff; text-align: center; padding: 8px 10px; font-weight: 600; color: #37474f; border-bottom: 2px solid #e8eaf6; white-space: nowrap; position: sticky; top: 0; z-index: 2; font-size: 11px; }
  td { padding: 7px 10px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  tr:active td { background: #eef0ff; }
  /* 隐藏标签列，搜索仍支持标签匹配 */
  th:nth-child(7), td:nth-child(7) { display: none; }

  .source-tag { display: inline-block; font-size: 9px; padding: 2px 7px; border-radius: 10px; color: #fff; font-weight: 600; }
  .source-tag.s1 { background: #5c6bc0; }
  .source-tag.s2 { background: #26a69a; }
  .source-tag.s3 { background: #ef5350; }
  .source-tag.s4 { background: #ff8f00; }
  .tag { display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 3px; margin: 1px 2px; background: #e3f2fd; color: #1565c0; white-space: nowrap; }
  .tag.green { background: #e8f5e9; color: #2e7d32; }
  .tag.red { background: #ffebee; color: #c62828; }
  .tag.purple { background: #f3e5f5; color: #6a1b9a; }
  .tag.orange { background: #fff3e0; color: #e65100; }
  .tag.teal { background: #e0f2f1; color: #00695c; }
  .commission { color: #2e7d32; font-weight: 600; }
  .price { color: #e65100; font-weight: 600; }
  .no-result { text-align: center; padding: 60px 20px; color: #999; font-size: 14px; }

  .bottom-bar { display: flex; background: #fff; border-top: 1px solid #e8e8e8; padding-bottom: env(safe-area-inset-bottom, 0px); flex-shrink: 0; }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 2px 6px; border: none; background: transparent; color: #999; font-size: 10px; cursor: pointer; transition: all .15s; position: relative; }
  .tab-btn:active { background: #f5f5ff; }
  .tab-btn .tab-icon { font-size: 18px; line-height: 1; margin-bottom: 1px; }
  .tab-btn .tab-label { font-size: 10px; }
  .tab-btn.active { color: #5c6bc0; }
  .tab-btn.active::after { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 20px; height: 2px; background: #5c6bc0; border-radius: 0 0 2px 2px; }

  .login-overlay { position: fixed; inset: 0; background: #f5f6fa; display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .login-box { background: #fff; padding: 36px 28px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.1); text-align: center; width: 320px; max-width: 88%; }
  .login-box h2 { margin-bottom: 4px; font-size: 18px; }
  .login-box p { color: #888; font-size: 13px; margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; margin-bottom: 12px; }
  .login-box input:focus { border-color: #5c6bc0; }
  .login-box .login-btn { width: 100%; padding: 12px; background: #5c6bc0; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600; }
  .login-box .login-btn:active { background: #3f51b5; }
  .login-box .login-err { color: #ef5350; font-size: 12px; margin-top: 10px; display: none; }

  .qr-modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 99999; cursor: pointer; }
  .qr-modal img { max-width: 80vw; max-height: 80vh; border-radius: 12px; }

  .filter-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 998; display: none; }
  .filter-overlay.show { display: block; }
  .filter-sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; z-index: 999; padding: 16px 20px 24px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateY(100%); transition: transform .3s ease; }
  .filter-sheet.show { transform: translateY(0); }
  .filter-sheet h3 { font-size: 14px; color: #333; margin-bottom: 12px; }
  .filter-sheet .sheet-btn { display: block; width: 100%; padding: 12px 14px; margin-bottom: 6px; border: none; background: #f5f6fa; border-radius: 10px; text-align: left; font-size: 14px; color: #333; cursor: pointer; }
  .filter-sheet .sheet-btn:active { background: #e8eaf6; }
  .filter-sheet .sheet-btn.active-sheet { background: #e8eaf6; color: #5c6bc0; font-weight: 600; }

  .import-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9998; display: none; }
  .import-overlay.show { display: block; }
  .import-dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #fff; border-radius: 16px; z-index: 9999; padding: 20px 24px; width: 560px; max-width: 92%; max-height: 85vh; display: none; flex-direction: column; box-shadow: 0 8px 40px rgba(0,0,0,.15); }
  .import-dialog.show { display: flex; }
  .import-dialog h3 { font-size: 15px; margin-bottom: 12px; color: #333; }
  .import-dialog select, .import-dialog textarea { width: 100%; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 13px; outline: none; font-family: inherit; }
  .import-dialog select { padding: 10px 12px; background: #f5f6fa; }
  .import-dialog textarea { padding: 10px; resize: vertical; min-height: 200px; background: #f5f6fa; line-height: 1.5; tab-size: 2; }
  .import-dialog textarea:focus, .import-dialog select:focus { border-color: #5c6bc0; }
  .import-dialog .import-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .import-dialog .import-actions button { padding: 9px 20px; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .import-dialog .import-actions .btn-primary { background: #5c6bc0; color: #fff; }
  .import-dialog .import-actions .btn-primary:active { background: #3f51b5; }
  .import-dialog .import-actions .btn-cancel { background: #f0f0f5; color: #555; }
  .import-dialog .import-actions .btn-cancel:active { background: #ddd; }
  .import-dialog .import-status { font-size: 12px; color: #666; margin-bottom: 10px; }

  .back-to-top { display: none; position: fixed; right: 16px; bottom: 80px; width: 40px; height: 40px; border-radius: 50%; background: #5c6bc0; color: #fff; border: none; font-size: 18px; cursor: pointer; box-shadow: 0 2px 10px rgba(92,107,192,.3); align-items: center; justify-content: center; z-index: 100; transition: all .2s; }
  .back-to-top:active { transform: scale(.9); }

  body.share-mode .header { display: none !important; }
  body.share-mode .logout-btn { display: none !important; }
  body.share-mode .login-hide, body.share-mode .order-btn { display: none !important; }
  body:not(.admin-mode) .header { display: none !important; }
  body:not(.admin-mode) .login-hide { display: none !important; }
  body:not(.admin-mode) .order-btn { display: none !important; }
  body:not(.admin-mode) .logout-btn { display: none !important; }

  .login-btn-floating { display: flex; position: fixed; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; background: rgba(92,107,192,.85); color: #fff; border: none; font-size: 16px; cursor: pointer; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(92,107,192,.3); z-index: 100; transition: all .2s; }
  .login-btn-floating:active { transform: scale(.9); background: #5c6bc0; }
  body.admin-mode .login-btn-floating { display: none; }

  .login-overlay { display: none; }
  .login-overlay.show { display: flex; }
  .login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9999; align-items: center; justify-content: center; }
  .login-box { background: #fff; padding: 36px 28px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.15); text-align: center; width: 320px; max-width: 88%; }
  .login-box h2 { margin-bottom: 4px; font-size: 18px; }
  .login-box p { color: #888; font-size: 13px; margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; margin-bottom: 12px; box-sizing:border-box; }
  .login-box input:focus { border-color: #5c6bc0; }
  .login-box .login-btn { width: 100%; padding: 12px; background: #5c6bc0; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600; }
  .login-box .login-btn:active { background: #3f51b5; }
  .login-box .login-err { color: #ef5350; font-size: 12px; margin-top: 10px; display: none; }

  @media (max-width: 768px) {
    .header-inner { padding: 8px 12px; }
    .header h1 { font-size: 15px; }
    .top-bar { padding: 6px 10px; }
    .search-input { width: 140px; font-size: 12px; padding: 6px 10px; }
    .search-input:focus { width: 180px; }
    .top-links { gap: 3px; }
    .order-btn { font-size: 9px; padding: 2px 8px; }

    table { table-layout: fixed; }
    th, td {
      padding: 5px 2px; font-size: 10px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; word-break: keep-all;
    }
    th:nth-child(1), td:nth-child(1) { width: 11%; }  /* 来源 */
    th:nth-child(2), td:nth-child(2) { width: 18%; }  /* 商品名称 */
    th:nth-child(3), td:nth-child(3) { width: 7%; }   /* 运营商 */
    th:nth-child(4), td:nth-child(4) { width: 10%; }  /* 佣金 */
    th:nth-child(5), td:nth-child(5) { width: 10%; }  /* 价格 */
    th:nth-child(6), td:nth-child(6) { width: 9%; }   /* 结算方式 */
    th:nth-child(8), td:nth-child(8) { width: 7%; }   /* 年龄要求 */
    th:nth-child(9), td:nth-child(9) { display: none; } /* 创建时间 */
    th:nth-child(10), td:nth-child(10) { display: none; } /* 备注 */
    th:nth-child(11), td:nth-child(11) { width: 9%; }  /* 领取链接 */
    th:nth-child(12), td:nth-child(12) { width: 6%; }  /* 扫码领取 */
  }
  @media (max-width: 480px) {
    .header h1 { font-size: 13px; }
    .search-input { width: 120px; font-size: 11px; }
    .search-input:focus { width: 150px; }

    th, td { font-size: 9px; padding: 4px 1px; }
    th:nth-child(12), td:nth-child(12) { width: 9%; }
  }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>管理登录</h2>
    <p>输入管理员密码查看完整信息</p>
    <input type="password" id="adminPwd" placeholder="管理员密码">
    <button class="login-btn" id="loginBtn">登录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<button class="login-btn-floating" id="loginBtnFloat" onclick="showLoginModal()" title="管理员登录">🔐</button>

<div class="header">
  <div class="header-inner">
    <h1>多平台商品数据汇总</h1>
    <div class="header-right">
      <span class="update-time" id="updateTime"></span>
      <button class="logout-btn" id="logoutBtn" onclick="doLogout()" style="display:none">退出</button>
    </div>
  </div>
</div>

<div class="app" id="app">

  <div class="top-bar">
    <div class="top-bar-row">
      <span class="total-badge">总计 <strong id="totalCount">-</strong> 条</span>
      <div class="top-actions">
        <input class="search-input" id="searchInput" placeholder="搜索商品..." oninput="filterTable()">
        <button class="icon-btn login-hide" onclick="regenerateQR()" title="重新生成二维码" style="font-size:12px;width:auto;padding:0 10px;border-radius:16px;background:#5c6bc0;color:#fff">QR</button>
        <button class="icon-btn login-hide" onclick="showImportDialog()" title="粘贴 curl 导入数据" style="font-size:12px;width:auto;padding:0 10px;border-radius:16px;background:#26a69a;color:#fff">📥</button>
        <button class="icon-btn" onclick="loadData()" title="刷新">⟳</button>
        <button class="icon-btn" onclick="showFilterMenu()" title="筛选">☰</button>
      </div>
    </div>
    <div class="top-links login-hide" id="topLinks">
      <a class="order-btn s1" id="orderKazhijia" href="javascript:void(0)" target="_blank">卡之家订单</a>
      <a class="order-btn s2" href="https://et.haomifi.com/admin/order/index" target="_blank">号易订单</a>
      <a class="order-btn s3" id="order172" href="javascript:void(0)" target="_blank">172号卡订单</a>
      <a class="order-btn s4" href="https://unionesim.com/agent/order/index" target="_blank">政企校园卡订单</a>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-inner" id="tableInner">
      <table>
        <thead><tr>
          <th style="width:80px">来源</th>
          <th style="width:340px">商品名称</th>
          <th style="width:60px">运营商</th>
          <th class="login-hide" style="width:70px">佣金</th>
          <th class="login-hide" style="width:80px">价格</th>
          <th class="login-hide" style="width:80px">结算方式</th>
          <th style="width:160px">标签</th>
          <th style="width:90px">年龄要求</th>
          <th style="width:90px">创建时间</th>
          <th class="login-hide" style="width:160px">备注</th>
          <th style="width:100px">领取链接</th>
          <th style="width:60px">扫码领取</th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ===== Supabase 配置 =====
const SUPABASE_URL = 'https://rnqrgmaeibwbfeqkjpky.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJucXJnbWFlaWJ3YmZlcWtqcGt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODQ0MjUsImV4cCI6MjEwMDU2MDQyNX0.QUDGuzcCwpPD2jH8sZ0Kd4wdNGcQKYXwj0EhfRveNME';
// 管理员密码将从 Supabase 的 app_config 表中读取（密码以 hash 形式存储）
let ADMIN_PASSWORD_HASH = '';

let supaClient = null;
try {
  supaClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
} catch (e) {
  console.error('Supabase init failed:', e);
}

// ===== 状态 =====
if (location.search.includes('share')) document.body.classList.add('share-mode');
let allItems = [];
let currentSource = 'all';

const sourceCls = {
  '卡之家': 's1',
  '号易': 's2',
  '172号卡': 's3',
  '政企校园卡': 's4',
};

// ===== 加载数据 =====
async function loadData() {
  document.getElementById('tableBody').innerHTML = '<tr><td colspan="12" class="no-result">加载中...</td></tr>';
  
  if (!supaClient) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="12" class="no-result">数据库连接未就绪，请刷新页面重试</td></tr>';
    return;
  }
  const { data, error } = await supaClient
    .from('products')
    .select('*')
    .or('active.is.null,active.eq.true')
    .order('source', { ascending: true });

  if (error) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="12" class="no-result">数据加载失败：' + esc(error.message) + '</td></tr>';
    return;
  }

  allItems = (data || []).map(item => ({
    source: item.source,
    sourceUrl: item.source_url || '',
    sourceLoginUrl: item.source_login_url || '',
    id: item.id,
    product_id: item.product_id || '',
    name: item.name || '',
    detailUrl: item.detail_url || '',
    operator: item.operator || '',
    commission: item.commission || '-',
    price: item.price || '-',
    settleMode: item.settle_mode || '-',
    createdAt: item.created_at || '',
    tags: (() => { try { return typeof item.tags === 'string' ? JSON.parse(item.tags) : (item.tags || []); } catch(e) { return []; } })(),
    age: item.age || '-',
    shareLink: item.share_link || '',
    claimLink: item.claim_link || '',
    qrCode: item.qr_code || '',
    remark: item.remark || '',
  }));

  document.getElementById('totalCount').textContent = allItems.length;
  
  // 显示更新时间
  if (data && data.length > 0) {
    const lastUpdated = data.reduce((latest, item) => {
      return item.updated_at > latest ? item.updated_at : latest;
    }, '');
    if (lastUpdated) {
      const d = new Date(lastUpdated);
      document.getElementById('updateTime').textContent = '更新于 ' + 
        d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
  }

  renderTable();
}

// ===== 渲染表格 =====
function renderTable() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = allItems.filter(item => {
    if (currentSource !== 'all' && item.source !== currentSource) return false;
    if (keyword) {
      const nameMatch = item.name.toLowerCase().includes(keyword);
      const tagsMatch = (item.tags || []).some(t => t.toLowerCase().includes(keyword));
      if (!nameMatch && !tagsMatch) return false;
    }
    return true;
  });

  const tbody = document.getElementById('tableBody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="12" class="no-result">没有匹配的数据</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(item => {
    const cls = sourceCls[item.source] || 's1';
    const tagsHtml = (item.tags || []).map(t => {
      const c = (t||'').includes('全国') ? 'green' : (t||'').includes('仅发')||(t||'').includes('禁发') ? 'red' : (t||'').includes('长期') ? 'purple' : (t||'').includes('优惠') ? 'orange' : (t||'').includes('宽带') ? 'teal' : '';
      return `<span class="tag ${c}">${esc(t)}</span>`;
    }).join('');
    return `<tr>
      <td title="${esc(item.sourceUrl)}"><a href="${esc(item.sourceLoginUrl)}" target="_blank" style="text-decoration:none"><span class="source-tag ${cls}">${esc(item.source)}</span><span class="login-hide" style="font-size:10px;color:#999;margin-left:4px">${esc(item.sourceUrl)}</span></a></td>
      <td title="${esc(item.name)}"><a href="${esc(item.detailUrl)}" target="_blank" style="color:#5c6bc0;text-decoration:none;font-weight:600">${esc(item.name)}</a></td>

// ===== 登录（密码验证，hash 从 Supabase 读取） =====
async function hashPassword(pwd) {
  const encoder = new TextEncoder();
  const data = encoder.encode(pwd);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function fetchAdminConfig() {
  // 从 Supabase 读取管理员配置（密码 hash 和手机号）
  if (!supaClient) {
    console.error('Supabase 未初始化，无法读取配置');
    return;
  }
  const { data, error } = await supaClient
    .from('app_config')
    .select('key, value');
  if (error) {
    console.error('读取配置失败:', error);
    return;
  }
  for (const row of data || []) {
    if (row.key === 'admin_password_hash') ADMIN_PASSWORD_HASH = row.value;
  }
}

async function doAdminLogin() {
  const pwd = document.getElementById('adminPwd').value;
  if (!pwd) {
    document.getElementById('loginErr').textContent = '请输入密码';
    document.getElementById('loginErr').style.display = 'block';

  // 如果还没加载配置，先加载
  if (!ADMIN_PASSWORD_HASH) {
    await fetchAdminConfig();

  const hash = await hashPassword(pwd);
  if (hash === ADMIN_PASSWORD_HASH) {
    localStorage.setItem('admin_logged_in', '1');
    document.getElementById('loginOverlay').classList.remove('show');
    document.getElementById('loginOverlay').style.display = 'none';

    document.getElementById('loginErr').textContent = '密码错误';
    document.getElementById('loginErr').style.display = 'block';
  }
}

// ===== 一键重新生成 QR 码并写入数据库 =====
async function regenerateQR() {
  if (!confirm('确定重新生成所有商品的二维码并更新到数据库？')) return;
  const btn = document.querySelector('[onclick="regenerateQR()"]');
  const orig = btn.textContent;
  btn.textContent = '...';
  btn.disabled = true;

  const pending = allItems.filter(it => !it.qrCode);
  if (pending.length === 0) {
    alert('所有商品已有二维码，无需重新生成');
    btn.textContent = orig;
    btn.disabled = false;
    return;
  }

  let success = 0, fail = 0;
  for (let i = 0; i < pending.length; i++) {
    const it = pending[i];
    const url = it.claimLink || it.detailUrl || it.shareLink || '';
    try {
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      const dataUrl = qr.createDataURL(4, 4);
      const { error } = await supaClient
        .from('products')
        .update({ claim_link: url, qr_code: dataUrl })
        .eq('id', it.id);
      if (error) throw error;
      it.qrCode = dataUrl;
      it.claimLink = url;
      success++;
    } catch (e) {
      console.error('QR 生成失败 id=' + it.id, e);
      fail++;
    }
    btn.textContent = success + '/' + pending.length;
  }

  renderTable();
  btn.textContent = '✅';
  btn.disabled = false;
  setTimeout(() => { btn.textContent = orig; }, 2000);
  alert('完成！成功更新 ' + success + ' 条，失败 ' + fail + ' 条');
}

// ===== 解析器（从 Python 移植，保持格式一致） =====
const PARSERS = {
  '卡之家': function(raw) {
    const data = (raw && raw.data) || raw || {};
    const list = data.list || data;
    if (!Array.isArray(list)) return [];
    const opMap = ['', '移动', '联通', '电信', '广电'];
    return list.filter(function(it) { return it && typeof it === 'object'; }).map(function(it) {
      return {
        source: '卡之家', source_url: 'hk.ehaoka.com', source_login_url: 'https://hk.ehaoka.com/admin/',
        product_id: String(it.id || ''),
        name: String(it.name || ''),
        detail_url: 'https://www.ehaoka.cn/shop#/pages/goods/index?goodsId=' + (it.id || '') + '&promoCode=Y9iVicCA',
        operator: opMap[it.operatorType] || String(it.operatorType || ''),
        commission: '¥' + (it.commission || 0),
        price: it.price ? '¥' + it.price : '-',
        settle_mode: it.settleMode === 1 ? '一次性' : '次月返',
        created_at: it.createdAt || '',
        tags: (it.tagsSelect || []).map(function(t) { return (t && t.label) || ''; }).filter(Boolean),
        age: (function() { var a = ((it.limitRule || {}).age || []); return a.length ? a.join('~') : '-'; })(),
        share_link: '', remark: '',
      };
    });
  },
  '号易': function(raw) {
    var rows = (raw && raw.rows) || raw || [];
    if (!Array.isArray(rows)) return [];
    return rows.filter(function(it) { return it && typeof it === 'object'; }).map(function(it) {
      return {
        source: '号易', source_url: 'et.haomifi.com', source_login_url: 'https://et.haomifi.com/admin/',
        product_id: String(it.id || ''),
        name: String(it.goods_name || ''),
        detail_url: 'https://my.86hk.vip/#/pages/goods/details?goods_id=' + (it.id || '') + '&share_id=' + (it.agent_id || ''),
        operator: '',
        commission: '¥' + (it.agent_brokerage || 0),
        price: '-',
        settle_mode: it.settlement_method === 2 ? '次月返' : '一次性',
        created_at: it.create_time || '',
        tags: (it.point_msg || []).slice(),
        age: '-',
        share_link: it.out_url || '',
        remark: String(it.point || ''),
      };
    });
  },
  '172号卡': function(raw) {
    var data = (raw && raw.data) || raw || [];
    if (!Array.isArray(data)) return [];
    var smap = {1:'月返', 2:'次月返', 3:'一次性', 4:'年返', 5:'季度返', 6:'半年返', 7:'一次性买断'};
    return data.filter(function(it) { return it && typeof it === 'object'; }).map(function(it) {
      var t = [(it.areaRead || '')];
      if (it.disableArea) t.push('禁发' + it.disableArea);
      t = t.filter(Boolean);
      var age1 = it.age1 || '', age2 = it.age2 || '';
      return {
        source: '172号卡', source_url: 'haokaapi.lot-ml.com', source_login_url: 'https://haoka.lot-ml.com/',
        product_id: String(it.productID || ''),
        name: String(it.productName || ''),
        detail_url: 'https://sztc.rimian666.cn/h5orderEn/index?pudID=' + (it.sn || '') + '&userid=' + (it.userSn || ''),
        operator: it.operator || '',
        commission: it.sPriceRead || '-',
        price: it.price ? '¥' + it.price : '-',
        settle_mode: smap[it.backMoneyType] || String(it.backMoneyType || '-'),
        created_at: it.createTime || '',
        tags: t,
        age: (age1 || age2) ? age1 + '~' + age2 + '岁' : '-',
        share_link: '', remark: it.remark || '',
      };
    });
  },
  '政企校园卡': function(raw) {
    var data = (raw && raw.data) || raw || [];
    if (!Array.isArray(data)) return [];
    return data.filter(function(it) { return it && typeof it === 'object'; }).map(function(it) {
      return {
        source: '政企校园卡', source_url: 'unionesim.com', source_login_url: 'https://unionesim.com/',
        product_id: String(it.id || ''),
        name: String(it.name || ''),

        commission: it.commission_display || ('¥' + (it.actual_commission || 0)),
        price: it.yuezu_format || '-',
        settle_mode: it.js_type_text || '-',

        tags: (String(it.tags || '').split(',')).filter(Boolean),
        age: it.age || '-',
        share_link: it.public_product_url || '',

      };
    });
  },

async function doImport() {
  var source = document.getElementById('importSource').value;
  var rawText = document.getElementById('importData').value.trim();
  if (!rawText) { alert('请先粘贴 JSON 数据'); return; }

  var statusEl = document.getElementById('importStatus');
  var btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.textContent = '解析中...';

  var raw;
  try { raw = JSON.parse(rawText); } catch (e) {
    statusEl.textContent = '❌ JSON 格式错误：' + e.message;
    btn.disabled = false; btn.textContent = '解析并导入';
    return;
  }

  var parser = PARSERS[source];
  if (!parser) { alert('未知来源'); btn.disabled = false; btn.textContent = '解析并导入'; return; }

  var items = parser(raw);
  if (!items.length) { statusEl.textContent = '⚠️ 未解析出任何商品数据'; btn.disabled = false; btn.textContent = '解析并导入'; return; }

  // 生成 QR 码
  statusEl.textContent = '✅ 解析出 ' + items.length + ' 条，正在生成 QR 码...';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var url = it.detail_url || it.share_link || '';
    it.claim_link = url;
    if (url) {
      try {
        var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
        it.qr_code = qr.createDataURL(4, 4);
      } catch (e) { it.qr_code = ''; }
    } else { it.qr_code = ''; }
  }

  // 写入数据库（旧数据置为失效，再插入新数据）
  statusEl.textContent = '⏳ 正在写入数据库（已生成 ' + items.length + ' 个 QR 码）...';
  btn.textContent = '写入中...';

  try {
    // 将该渠道旧数据置为失效
    var { error: updErr } = await supaClient
      .from('products')
      .update({ active: false })
      .eq('source', source)
      .or('active.is.null,active.eq.true');
    if (updErr) throw new Error('置旧数据为失效失败: ' + updErr.message);

    // 新数据标记 active=true
    for (var k = 0; k < items.length; k++) items[k].active = true;

    // 批量插入
    var batchSize = 500;
    var inserted = 0;
    for (var j = 0; j < items.length; j += batchSize) {
      var batch = items.slice(j, j + batchSize);
      var { error: insErr } = await supaClient
        .from('products')
        .insert(batch);
      if (insErr) throw new Error('插入数据失败: ' + insErr.message);
      inserted += batch.length;
      statusEl.textContent = '⏳ 已写入 ' + inserted + '/' + items.length + ' 条...';
    }

    statusEl.textContent = '✅ 导入完成！共 ' + inserted + ' 条商品数据';
    btn.textContent = '✅ 完成';
    setTimeout(function() { btn.textContent = '解析并导入'; btn.disabled = false; }, 2000);

    // 刷新页面数据
    await loadData();
  } catch (e) {
    statusEl.textContent = '❌ ' + e.message;
    btn.disabled = false;
    btn.textContent = '解析并导入';
  }
}
